services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_jira
      POSTGRES_USER: ai_jira
      POSTGRES_PASSWORD: ai_jira_dev_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg://ai_jira:ai_jira_dev_password@db:5432/ai_jira
      MOCK_MODE: "true"
      API_TOKEN: dev-token
    ports: ["8000:8000"]
  ui:
    build: .
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on: [api]
    ports: ["8501:8501"]
volumes:
  postgres_data:
